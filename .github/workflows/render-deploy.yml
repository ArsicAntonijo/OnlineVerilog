name: Deploy to Render

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    name: Run docker build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "tonkac" --password-stdin

      - name: Build Docker image
        run: docker build -t tonkac/veron:latest .

      - name: Push Docker image
        run: docker push tonkac/veron:latest
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Trigger Render Deploy
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
